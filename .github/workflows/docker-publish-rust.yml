name: Publish Rust Release
on:
  push:
    tags:
      - 'v5.*'
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: docker-publish-rust
  cancel-in-progress: true
jobs:
  # ================= Docker 镜像（仅GHCR，移除Docker Hub） =================
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup buildx（hosted runner 预装 docker——buildx 插件标准化）
        uses: docker/setup-buildx-action@v3
      - name: 登录 GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ shturl.cc/W2 }} --password-stdin
      - name: 构建并推送 amd64 镜像（type=gha 缓存——GitHub Actions cache 跨 run 持久）
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --push \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -t ghcr.io/${{ github.repository }}:latest \
            -t ghcr.io/${{ github.repository }}:${{ github.ref_name }} \
            .
